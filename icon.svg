<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Portal Ambient Dark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39393f"/>
      <stop offset="1" stop-color="#25252c"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="35" cy="20" r="14" fill="#000"/>
    </mask>
  </defs>

  <!-- background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- moon (dark mode) in the primary slate blue -->
  <circle cx="27" cy="27" r="16" fill="#8a9bd0" mask="url(#crescent)"/>

  <!-- accent spark -->
  <path fill="#ff5959" d="M46 12l1.8 4.2L52 18l-4.2 1.8L46 24l-1.8-4.2L40 18l4.2-1.8z"/>

  <!-- palette swatches -->
  <rect x="12" y="48" width="12" height="6" rx="2" fill="#a1a1a3"/>
  <rect x="26" y="48" width="12" height="6" rx="2" fill="#8a9bd0"/>
  <rect x="40" y="48" width="12" height="6" rx="2" fill="#ff5959"/>
</svg>
